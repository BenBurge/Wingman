# Publishes wingman.exe as a self-contained, untrimmed single file for win-x64 and win-arm64,
# and ships each as a zip and as a per-user Inno Setup installer (installer/wingman.iss).
# Native AOT and trimming are off: Wingman.Core's System.Text.Json calls are reflection based
# (IL2026, IL3050) and TreatWarningsAsErrors fails the publish on those warnings. The publish
# properties live in src/Wingman/Wingman.csproj under a RuntimeIdentifier condition.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/Wingman/Wingman.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Zip
        shell: pwsh
        run: |
          $zip = "wingman-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path out/${{ matrix.rid }}/wingman.exe -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: tools/Build-Installer.ps1 -Version ${{ steps.version.outputs.version }} -Rid ${{ matrix.rid }} -OutputDir . -SkipPublish -SourceDir out/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: wingman-${{ matrix.rid }}
          path: |
            wingman-${{ github.ref_name }}-${{ matrix.rid }}.zip
            wingman-${{ github.ref_name }}-${{ matrix.rid }}.zip.sha256
            wingman-${{ github.ref_name }}-${{ matrix.rid }}-setup.exe
            wingman-${{ github.ref_name }}-${{ matrix.rid }}-setup.exe.sha256

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # Stamps the winget manifest with this release's version and installer hashes.
      # Pure PowerShell (no winget validate, which is Windows-only), so it runs here on
      # ubuntu. Not committed back: Ben copies the artifact into a PR against
      # microsoft/winget-pkgs himself once he has reviewed it.
      - name: Update winget manifest
        shell: pwsh
        run: tools/Update-Manifest.ps1 -Version ${{ steps.version.outputs.version }} -Sha256Dir artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: manifests/
