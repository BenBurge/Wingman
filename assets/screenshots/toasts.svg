<svg xmlns="http://www.w3.org/2000/svg" width="400" height="368" viewBox="0 0 400 368" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <symbol id="appicon" viewBox="0 0 16 16">
      <rect width="16" height="16" rx="3.5" fill="#F0B54A"/>
      <svg x="2.5" y="2.5" width="11" height="11" viewBox="0 0 16 16">
        <path d="M1.5 4 L4.3 12.5 L7 6 L9.7 12.5 C10.8 8 12.4 5 15 2.5" fill="none" stroke="#171B26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </symbol>
  </defs>

  <g transform="translate(18 18)" filter="url(#shadow)">
    <rect width="364" height="170" rx="8" fill="#202020" stroke="#3A3A3A"/>
    <use href="#appicon" x="16" y="14" width="16" height="16"/>
    <text x="40" y="26" font-size="12" fill="#C8C8C8">Wingman</text>
    <text x="324" y="26" font-size="12" fill="#8A8A8A" text-anchor="end">now</text>
    <text x="344" y="26" font-size="12" fill="#8A8A8A" text-anchor="end">✕</text>
    <text x="16" y="56" font-size="14" font-weight="600" fill="#FFFFFF">19 updates available</text>
    <text x="16" y="78" font-size="14" fill="#C8C8C8">AutoHotkey, Azure Developer CLI, Claude Code</text>
    <text x="16" y="97" font-size="14" fill="#C8C8C8">and 16 more</text>
    <rect x="16" y="120" width="162" height="32" rx="5" fill="#2D2D2D" stroke="#3F3F3F"/>
    <text x="97" y="141" font-size="13" fill="#FFFFFF" text-anchor="middle">Update all</text>
    <rect x="186" y="120" width="162" height="32" rx="5" fill="#2D2D2D" stroke="#3F3F3F"/>
    <text x="267" y="141" font-size="13" fill="#FFFFFF" text-anchor="middle">Open</text>
  </g>

  <g transform="translate(18 204)" filter="url(#shadow)">
    <rect width="364" height="146" rx="8" fill="#202020" stroke="#3A3A3A"/>
    <use href="#appicon" x="16" y="14" width="16" height="16"/>
    <text x="40" y="26" font-size="12" fill="#C8C8C8">Wingman</text>
    <text x="324" y="26" font-size="12" fill="#8A8A8A" text-anchor="end">2m</text>
    <text x="344" y="26" font-size="12" fill="#8A8A8A" text-anchor="end">✕</text>
    <text x="16" y="56" font-size="14" font-weight="600" fill="#FFFFFF">3 of 3 updated</text>
    <text x="16" y="78" font-size="14" fill="#C8C8C8">3 succeeded, 0 failed, 0 canceled</text>
    <rect x="16" y="96" width="332" height="32" rx="5" fill="#2D2D2D" stroke="#3F3F3F"/>
    <text x="182" y="117" font-size="13" fill="#FFFFFF" text-anchor="middle">View log</text>
  </g>
</svg>
